<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" class="euclid-graphic" data-graphic-id="0048.g1" data-folio="0048" data-graphic="g1" width="380" height="260">
  <title>Fig. 17 — Locus of Equal Difference of Squared Distances (§ 14)</title>
  <desc>Fixed points M, M1 and locus line NQ perpendicular to MM1 where MN^2 - M1N^2 = u^2.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: #ffffff;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: #18181b;
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: #18181b;
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle {
      stroke: #18181b;
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed {
      stroke: #18181b;
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 5, 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.78;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: #18181b;
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .geom-polygon {
      fill: #000000;
      fill: var(--geom-poly-fill);
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .wedge, .angle {
      fill: #c88a1e;
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: #c88a1e;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #18181b;
      fill: var(--geom-fg);
      stroke: #ffffff;
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      font-style: normal;
      fill: #18181b;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-secondary, text.geom-highlight-active *, text.geom-highlight-secondary * {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active, path.geom-polygon.geom-highlight-active, .wedge:hover, .wedge.highlight, .wedge.angle.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active, text.geom-assert-secondary, text.geom-assert-active *, text.geom-assert-secondary * {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active, path.geom-polygon.geom-assert-active, .wedge.angle.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    path.geom-ang-arc.geom-assert-active {
      opacity: 1 !important;
      fill: none !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 { marker-mid: url(#geom-tick-1); }
    path.geom-assert-active.geom-tick-2 { marker-mid: url(#geom-tick-2); }
    path.geom-assert-active.geom-tick-3 { marker-mid: url(#geom-tick-3); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
    <path id="line-M-M1" data-ref="[ M M1 ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 65 190 L 190 190 L 315 190" />
    <path id="line-N-Q" data-ref="[ N Q ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 230 65 L 230 127.5 L 230 190" />
    <path id="line-N-M" data-ref="[ N M ]" class="geom-dashed" fill="none" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5, 4" stroke-linecap="round" d="M 230 65 L 147.5 127.5 L 65 190" />
    <path id="line-N-M1" data-ref="[ N M1 ]" class="geom-dashed" fill="none" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5, 4" stroke-linecap="round" d="M 230 65 L 272.5 127.5 L 315 190" />
  </g>
  <g id="graphics">
    <path id="seg-M-M1" data-ref="/ M M1 /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 65 190 L 190 190 L 315 190" />
    <path id="seg-N-Q" data-ref="/ N Q /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 230 65 L 230 127.5 L 230 190" />
    <path id="seg-N-M" data-ref="/ N M /" class="geom-dashed" fill="none" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5, 4" stroke-linecap="round" d="M 230 65 L 147.5 127.5 L 65 190" />
    <path id="seg-N-M1" data-ref="/ N M1 /" class="geom-dashed" fill="none" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5, 4" stroke-linecap="round" d="M 230 65 L 272.5 127.5 L 315 190" />
  </g>
  <g id="highlights" style="pointer-events: none;" opacity="0">
    <path id="hl-M-M1" data-ref="/ M M1 /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 65 190 L 190 190 L 315 190" />
    <path id="hl-N-Q" data-ref="/ N Q /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 230 65 L 230 127.5 L 230 190" />
    <path id="hl-N-M" data-ref="/ N M /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 230 65 L 147.5 127.5 L 65 190" />
    <path id="hl-N-M1" data-ref="/ N M1 /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 230 65 L 272.5 127.5 L 315 190" />
  </g>
  <g id="points">
    <circle id="pt-M" data-ref="M" class="geom-point" cx="65" cy="190" r="3.2" fill="#18181b" stroke="#ffffff" stroke-width="1.2" />
    <circle id="pt-M1" data-ref="M1" class="geom-point" cx="315" cy="190" r="3.2" fill="#18181b" stroke="#ffffff" stroke-width="1.2" />
    <circle id="pt-Q" data-ref="Q" class="geom-point" cx="230" cy="190" r="3.2" fill="#18181b" stroke="#ffffff" stroke-width="1.2" />
    <circle id="pt-N" data-ref="N" class="geom-point" cx="230" cy="65" r="3.2" fill="#18181b" stroke="#ffffff" stroke-width="1.2" />
  </g>
  <g id="labels">
    <text id="label-M" data-ref="M" class="geom-label" x="59" y="208" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">M</text>
    <text id="label-M1" data-ref="M1" class="geom-label" x="309" y="208" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">M₁</text>
    <text id="label-Q" data-ref="Q" class="geom-label" x="236" y="208" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">Q</text>
    <text id="label-N" data-ref="N" class="geom-label" x="238" y="61" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">N</text>
  </g>
</svg>
