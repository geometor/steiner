      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .wedge, .angle {
      fill: #c88a1e;
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: #c88a1e;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
      transition: opacity 0.12s ease, fill-opacity 0.12s ease;
    }
    .geom-point {
      fill: #18181b;
      fill: var(--geom-fg);
      stroke: #ffffff;
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
