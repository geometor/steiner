    <circle id="circ-M2" data-ref="( M2 )" class="geom-dashed" fill="none" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5, 4" stroke-linecap="round" cx="235" cy="195" r="18" />
    <circle id="circ-M3" data-ref="( M3 )" class="geom-dashed" fill="none" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5, 4" stroke-linecap="round" cx="345" cy="160" r="42" />
    <path id="line-M1-A3" data-ref="[ M1 A3 ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 250 125 L 229 223 L 208 321" />
