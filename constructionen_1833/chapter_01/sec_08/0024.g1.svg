    <path id="line-C-D" data-ref="[ C D ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 295 55 L 275 92.5 L 255 130" />
    <path id="line-D-E" data-ref="[ D E ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 255 130 L 225 177.5 L 195 225" />
  </g>
  <g id="graphics">
    <path id="seg-C-E" data-ref="/ C E /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 295 55 L 245 140 L 195 225" />
    <path id="seg-C-D" data-ref="/ C D /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 295 55 L 275 92.5 L 255 130" />
    <path id="seg-D-E" data-ref="/ D E /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 255 130 L 225 177.5 L 195 225" />
  </g>
  <g id="highlights" style="pointer-events: none;" opacity="0">
    <path data-ref="[ A B ]" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 45 55 L 92.5 55 L 140 55" />
    <path data-ref="[ B ]" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 45 130 L 112.5 130 L 180 130" />
    <path id="hl-C-E" data-ref="/ C E /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 295 55 L 245 140 L 195 225" />
    <path id="hl-C-D" data-ref="/ C D /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 295 55 L 275 92.5 L 255 130" />
    <path id="hl-D-E" data-ref="/ D E /" class="geom-line geom-overlay" fill="none" stroke="none" opacity="0" d="M 255 130 L 225 177.5 L 195 225" />
  </g>
