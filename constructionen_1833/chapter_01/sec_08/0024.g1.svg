    <text id="label-B" data-ref="B" class="geom-label" x="55" y="122" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">B</text>
    <text id="label-C" data-ref="C" class="geom-label" x="303" y="51" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">C</text>
    <text id="label-D" data-ref="D" class="geom-label" x="265" y="134" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">D</text>
    <text id="label-E" data-ref="E" class="geom-label" x="203" y="233" fill="#18181b" font-family="sans-serif" font-size="13.5" font-weight="700">E</text>
