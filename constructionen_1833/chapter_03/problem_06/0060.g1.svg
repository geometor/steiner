    <path id="seg-a-b" data-ref="/ a b /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 244.25 189.79 L 175 200 L 105.75 210.21" />
    <path id="seg-M-M1" data-ref="/ M M1 /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 175 200 L 115 135 L 55 70" />
    <path id="seg-M-M2" data-ref="/ M M2 /" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 175 200 L 250 137.5 L 325 75" />
