    <path id="line-M-M1" data-ref="[ M M1 ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 175 200 L 115 135 L 55 70" />
    <path id="line-M-M2" data-ref="[ M M2 ]" class="geom-line" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" d="M 175 200 L 250 137.5 L 325 75" />
